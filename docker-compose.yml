services:
  db:
    image: postgres:17
    container_name: postgres_sgls_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sgls
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sgls"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrations:
    container_name: sgls_migrations
    build:
      context: ./sglsbackend/WebApplicationsgls
      dockerfile: Dockerfile
      target: migrations
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=sgls;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: MinhaLoja.Api
      Jwt__Audience: MinhaLoja.Web
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    container_name: backend_sgls_api
    build:
      context: ./sglsbackend/WebApplicationsgls
      dockerfile: Dockerfile
      target: final
    ports:
      - "5150:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=sgls;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: MinhaLoja.Api
      Jwt__Audience: MinhaLoja.Web
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    container_name: frontend_sgls
    build:
      context: ./sglsfrontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data: